<div class="container card my-5">
    <h1 class="my-2">Student Info</h1>
    <table class="table">
        <thead>
            <tr>
                <td scope="col"><b>Name</b></td>
                <td scope="col"><b>Age</b></td>
                <td scope="col"><b>Courseiiiu</b></td>
            </tr>
        </thead>

    </table>
</div>
