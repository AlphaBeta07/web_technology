<div class="customer-container animate-fade-in">
  <div class="header-section">
    <h1>Book Your Experience</h1>
    <p>Select your desired service and preferred time. We'll take care of the rest.</p>
  </div>

  <div class="card booking-card">
    <form (ngSubmit)="submitBooking()" #bookingForm="ngForm">
      <div class="form-row">
        <div class="form-group half-width">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" [(ngModel)]="booking.name" required>
        </div>
        <div class="form-group half-width">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" name="phone" [(ngModel)]="booking.phone" required>
        </div>
      </div>

      <div class="form-group">
        <label for="service">Select Service</label>
        <select id="service" name="serviceId" [(ngModel)]="booking.serviceId" required>
          <option value="" disabled selected>Choose a service</option>
          <option *ngFor="let service of services" [value]="service.id">
            {{ service.name }} - ₹{{ service.price }}
          </option>
        </select>
      </div>

      <div class="form-row">
        <div class="form-group half-width">
          <label for="date">Date</label>
          <input type="date" id="date" name="date" [(ngModel)]="booking.date" required>
        </div>
        <div class="form-group half-width">
          <label for="time">Time</label>
          <input type="time" id="time" name="time" [(ngModel)]="booking.time">
        </div>
      </div>

      <button type="submit" [disabled]="!bookingForm.valid" class="submit-btn">
        <span>Confirm Booking</span>
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
      </button>
    </form>
  </div>
</div>
